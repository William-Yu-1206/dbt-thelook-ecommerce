version: 2

models:
  - name: stg_orders
    description: "粒度：一列 = 一筆訂單"
    columns:
      - name: order_id
        tests: 
          - unique
          - not_null   

      - name: user_id
        tests: ['not_null']

      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['Cancelled', 'Complete', 'Processing', 'Returned', 'Shipped']